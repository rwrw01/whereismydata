services:
  har-provider-lookup:
    build: .
    ports:
      - "8080:8080"
    environment:
      ALLOWED_ORIGIN: "http://localhost:5173"
      PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/healthz', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 4s
      retries: 3
