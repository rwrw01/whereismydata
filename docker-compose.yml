services:
  har-provider-lookup:
    build: .
    ports:
      - "8080:8080"
    environment:
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:5173}"
      PORT: "8080"
      RATE_LIMIT_PER_HOUR: "${RATE_LIMIT_PER_HOUR:-10}"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import os, httpx; httpx.get('http://localhost:' + os.environ.get('PORT', '8080') + '/healthz', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 4s
      retries: 3
